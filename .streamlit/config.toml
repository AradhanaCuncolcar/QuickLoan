# .streamlit/config.toml — colourful theme
[theme]
primaryColor = "#10B981"            # Emerald: sliders, toggles, active widgets
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

# Deep indigo/purple sidebar (the app's CSS adds the gradient on top)
[theme.sidebar]
backgroundColor = "#1E1B4B"
secondaryBackgroundColor = "#4C1D95"
textColor = "#F8FAFC"
primaryColor = "#F472B6"

[server]
headless = true

[browser]
gatherUsageStats = false
